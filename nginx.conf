events{}

http {
    ## chargement de fichier des types MIME pour éviter bug d'affichage dans navigateur
    include /etc/nginx/mime.types;
    ## type binaire générique utilisé si navigateur ne reconnaît pas extension de fichier
    default_type application/octet-stream;
    ## standard du web, permet au navigateur d'interpréter caractères spéciaux
    charset utf-8;
    
    ## obfuscation de la stack Nginx
    server_tokens off;

    ## paramètres du rate-limiter : zone mémoire + 10 requêtes par seconde
    ## ! cause crash dû à politique CORS - à creuser
    # limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    ## en-têtes de sécurité globaux
    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;
    ## contre attaques MIME sniffing
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    ## header CSP
    ## ! à reprendre car le script-src self bloque l'accès aux deux front
    # add_header Content-Security-Policy "
    #     default-src 'self'; 
    #     script-src 'self'; 
    #     object-src 'none'; 
    #     frame-ancestors 'none';
    # " always;

    server {
        listen 80;
        ## en prod sécurisée
        #listen 443 ssl
        server_name localhost;

        ## certificats HTTPS
        # ssl_certificate /etc/nginx/certs/fullchain.crt;
        # ssl_certificate_key /etc/nginx/certs/privkey.key;
        
        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        ## en prod sécurisée
        #listen 443 ssl
        server_name backoffice.localhost;

        ## certificats HTTPS
        # ssl_certificate /etc/nginx/certs/fullchain.crt;
        # ssl_certificate_key /etc/nginx/certs/privkey.key;

        location / {
            proxy_pass http://backoffice:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 80;
        ## en prod sécurisée
        #listen 443 ssl
        server_name backend.localhost;

        ## certificats HTTPS
        # ssl_certificate /etc/nginx/certs/fullchain.crt;
        # ssl_certificate_key /etc/nginx/certs/privkey.key;

        location / {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            ## rate-limiter sur les requêtes API avec autorisation de 5 requêtes au-dessus de limite ci-dessus
            # limit_req zone=api_limit burst=5 nodelay;

        }
    }
}

