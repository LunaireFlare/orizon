services:  
  reverseproxy:
    image: nginx:latest
    ports:
      - 81:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      # - backoffice
      # - frontend

  database:
    image: postgres:latest
    environment:
      POSTGRES_USER: seniorlove
      POSTGRES_PASSWORD: seniorlove
      POSTGRES_DB: seniorlove
    volumes:
      - ./data:/docker-entrypoint-initdb.d/
      - ./database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seniorlove -d seniorlove"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ports:
    #   - 3000:3000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      database:
        condition: service_healthy
    command: npm run start

